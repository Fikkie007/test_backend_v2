services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: product_api
      DB_USERNAME: product_api
      DB_PASSWORD: product_api
      CORS_ALLOWED_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: product_api
      POSTGRES_USER: product_api
      POSTGRES_PASSWORD: product_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_api -d product_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
